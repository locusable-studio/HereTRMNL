name: HereTRMNL
options:
  bundleIdPrefix: com.locusable
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.5
targets:
  HereTRMNL:
    type: application
    platform: macOS
    sources:
      - path: HereTRMNL
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.locusable.heretrmnl
        PRODUCT_NAME: HereTRMNL
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: HereTRMNL/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: HereTRMNL
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSMultipleInstancesProhibited: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        CODE_SIGN_ENTITLEMENTS: HereTRMNL/HereTRMNL.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: HereTRMNL/HereTRMNL.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    postCompileScripts:
      - name: Sign Sparkle
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" != "Release" ] || [ "$ACTION" != "install" ]; then
            exit 0
          fi

          APP="$CODESIGNING_FOLDER_PATH"
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          XPC_DIR="$SPARKLE/Versions/Current/XPCServices"

          if [ ! -d "$XPC_DIR" ]; then
            exit 0
          fi

          for xpc in "$XPC_DIR"/*.xpc; do
            /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp --options runtime --preserve-metadata=identifier,entitlements "$xpc"
          done

          /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp --options runtime --preserve-metadata=identifier,entitlements "$SPARKLE"
  HereTRMNLTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HereTRMNLTests
    dependencies:
      - target: HereTRMNL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.locusable.heretrmnl.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  HereTRMNL:
    build:
      targets:
        HereTRMNL: all
        HereTRMNLTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HereTRMNLTests
